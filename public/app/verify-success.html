<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Email verified | LedgerHaul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Your LedgerHaul email has been verified." />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
    }
    a { color: #37d18c; text-decoration: none; }

    .wrap {
      max-width: 520px;
      margin: 140px auto;
      padding: 40px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
      text-align: center;
    }

    h1 { margin: 0 0 14px; font-size: 28px; }
    p { margin: 0 0 22px; color: #cfe6db; font-size: 14px; line-height: 1.6; }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      background: #37d18c;
      color: #0b140f;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Email verified</h1>
    <p>Your LedgerHaul account is now active. You can sign in to continue.</p>
    <a class="btn" href="/app/login.html">Sign in</a>
  </div>
</body>
</html>
