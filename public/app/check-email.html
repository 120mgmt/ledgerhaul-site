<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Check Your Email | LedgerHaul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #ffffff;
    }

    .wrap {
      max-width: 520px;
      margin: 140px auto;
      padding: 40px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 28px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #cfe6db;
      margin-bottom: 24px;
    }

    .hint {
      font-size: 13px;
      color: #9bbfb0;
    }

    a {
      color: #37d18c;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Check your email</h1>
    <p>
      We’ve sent a verification link to your email address.
      Please click the link to activate your LedgerHaul account.
    </p>
    <p class="hint">
      Didn’t receive it? Check spam or contact
      <a href="mailto:info@ledgerhaul.com">info@ledgerhaul.com</a>.
    </p>
  </div>
</body>
</html>
