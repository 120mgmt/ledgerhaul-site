<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create LedgerHaul Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="ledgerhaul-api-base" content="" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 22px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 18px;
      padding: 38px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }
    .logo {
      font-weight: 800;
      letter-spacing: .4px;
      color: #37d18c;
      font-size: 18px;
    }
    .pill {
      font-size: 12px;
      color: #cfe6db;
      border: 1px solid #214536;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14,31,23,.35);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 30px;
      color: #fff;
      line-height: 1.15;
    }
    .sub {
      margin: 0 0 26px 0;
      color: #cfe6db;
      font-size: 14px;
      line-height: 1.6;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #cfe6db;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid #2a4b3a;
      background: #0e1f17;
      color: #fff;
      font-size: 15px;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #37d18c;
      box-shadow: 0 0 0 3px rgba(55,209,140,.15);
    }
    .checkbox-wrap {
      margin: 2px 0 18px 0;
      padding: 14px;
      border: 1px solid #2a4b3a;
      border-radius: 12px;
      background: rgba(14,31,23,.35);
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      font-size: 13px;
      color: #cfe6db;
      line-height: 1.6;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 2px 0 0 0;
      flex: 0 0 auto;
      accent-color: #37d18c;
      cursor: pointer;
    }
    .checkbox-label a {
      color: #a8c7bb;
      text-decoration: underline;
    }
    .checkbox-label a:hover {
      color: #fff;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: #37d18c;
      color: #0b140f;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    .error {
      margin-top: 16px;
      font-size: 13px;
      color: #ff9b9b;
      min-height: 18px;
    }
    .ok {
      margin-top: 16px;
      font-size: 13px;
      color: #9ff2c9;
      min-height: 18px;
    }
    .links {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #a8c7bb;
    }
    .links a {
      color: #a8c7bb;
      text-decoration: underline;
    }
    .links a:hover {
      color: #fff;
    }
    .legal {
      margin-top: 26px;
      font-size: 12px;
      color: #a8c7bb;
      text-align: center;
    }
    .legal a {
      color: #a8c7bb;
      margin: 0 6px;
      text-decoration: underline;
    }
    .legal a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <div class="logo">LedgerHaul</div>
      <div class="pill">Secure account creation</div>
    </div>

    <h1>Create your LedgerHaul account</h1>
    <p class="sub">This creates your account in the live platform and triggers a verification email.</p>

    <form id="signup-form" novalidate>
      <label for="company">Company name</label>
      <input id="company" name="company" type="text" autocomplete="organization" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required />

      <div class="checkbox-wrap">
        <label class="checkbox-label" for="legal_acceptance">
          <input id="legal_acceptance" name="legal_acceptance" type="checkbox" />
          <span>
            I agree to the
            <a href="/legal/terms.html" target="_blank" rel="noopener noreferrer">Terms</a>,
            <a href="/legal/privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>,
            and
            <a href="/legal/refund.html" target="_blank" rel="noopener noreferrer">Refund Policy</a>.
          </span>
        </label>
      </div>

      <button id="submitBtn" type="submit">Create account</button>
    </form>

    <div id="error" class="error"></div>
    <div id="ok" class="ok"></div>

    <div class="links">
      <a href="/app/login.html">Already have an account? Log in</a>
      <a href="/app/forgot-password.html">Forgot password</a>
    </div>

    <div class="legal">
      <span>Legal:</span>
      <a href="/legal/terms.html">Terms</a> ·
      <a href="/legal/privacy.html">Privacy</a> ·
      <a href="/legal/refund.html">Refund</a>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>

  <script>
    const metaApi = document.querySelector('meta[name="ledgerhaul-api-base"]');
    const metaApiBase = (metaApi && metaApi.getAttribute("content"))
      ? String(metaApi.getAttribute("content")).trim()
      : "";

    const API_BASE =
      (window.LH_CONFIG && window.LH_CONFIG.API_BASE_URL && String(window.LH_CONFIG.API_BASE_URL).trim())
        ? String(window.LH_CONFIG.API_BASE_URL).trim().replace(/\/+$/,"")
        : (metaApiBase ? metaApiBase.replace(/\/+$/,"") : "https://api.ledgerhaul.com");

    const form = document.getElementById("signup-form");
    const errorEl = document.getElementById("error");
    const okEl = document.getElementById("ok");
    const submitBtn = document.getElementById("submitBtn");

    function safeJsonParse(text) {
      try { return JSON.parse(text); } catch { return null; }
    }

    function normalizeErrorMessage(r) {
      const msg =
        (r && r.json && (r.json.error || r.json.message || r.json.detail)) ||
        (r && r.raw && r.raw.trim()) ||
        `Signup failed (${(r && r.status) ? r.status : "unknown"})`;

      const lowered = String(msg).toLowerCase();

      if (lowered.includes("company_name required")) return "Company name is required.";
      if (lowered.includes("email and password required")) return "Email and password are required.";
      if (lowered.includes("password too short")) return "Password must be at least 10 characters.";
      if (lowered.includes("legal_acceptance_required_at_signup")) {
        return "You must accept the Terms, Privacy Policy, and Refund Policy to create an account.";
      }
      return msg;
    }

    async function postJson(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const raw = await res.text();
      const json = safeJsonParse(raw);

      return { ok: res.ok, status: res.status, json, raw };
    }

    async function trySignup(company, email, password, accepted) {
      const endpoints = [
        `${API_BASE}/auth/register`,
        `${API_BASE}/auth/signup`
      ];

      const payloads = [
        {
          company_name: company,
          email,
          password,
          legal_acceptance: accepted,
          accepted_tos: accepted,
          accepted_privacy: accepted,
          accepted_refund: accepted
        },
        {
          company_name: company,
          company: company,
          email,
          password,
          legal_acceptance: accepted,
          accepted_tos: accepted,
          accepted_privacy: accepted,
          accepted_refund: accepted
        },
        {
          company_name: company,
          organization_name: company,
          email,
          password,
          legal_acceptance: accepted,
          accepted_tos: accepted,
          accepted_privacy: accepted,
          accepted_refund: accepted
        },
        {
          company_name: company,
          company: company,
          organization_name: company,
          email,
          password,
          legal_acceptance: accepted,
          accepted_tos: accepted,
          accepted_privacy: accepted,
          accepted_refund: accepted
        }
      ];

      let last = null;

      for (const endpoint of endpoints) {
        for (const payload of payloads) {
          const r = await postJson(endpoint, payload);
          if (r.ok) return;
          last = r;
        }
      }

      throw new Error(normalizeErrorMessage(last));
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      okEl.textContent = "";

      const company = document.getElementById("company").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const accepted = !!document.getElementById("legal_acceptance").checked;

      if (!company) {
        errorEl.textContent = "Company name is required.";
        return;
      }

      if (!email) {
        errorEl.textContent = "Email is required.";
        return;
      }

      if (!password || password.length < 10) {
        errorEl.textContent = "Password must be at least 10 characters.";
        return;
      }

      if (!accepted) {
        errorEl.textContent = "You must accept the Terms, Privacy Policy, and Refund Policy to create an account.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating…";

      try {
        await trySignup(company, email, password, accepted);
        okEl.textContent = "Account created. Check your email for the verification link.";
        window.location.href = "/app/check-email.html";
      } catch (err) {
        errorEl.textContent = (err && err.message) ? err.message : "Signup failed";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
