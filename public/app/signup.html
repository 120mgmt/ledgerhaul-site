<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create LedgerHaul Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
      padding: 36px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 28px;
      color: #ffffff;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #cfe6db;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #2a4b3a;
      background: #0e1f17;
      color: #ffffff;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #37d18c;
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #37d18c;
      color: #0b140f;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .error {
      margin-top: 16px;
      font-size: 13px;
      color: #ff9b9b;
    }

    .legal {
      margin-top: 28px;
      font-size: 12px;
      color: #a8c7bb;
      text-align: center;
    }

    .legal a {
      color: #a8c7bb;
      margin: 0 6px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Create your LedgerHaul account</h1>

    <form id="signup-form">
      <label>Company name</label>
      <input id="company" required />

      <label>Email</label>
      <input id="email" type="email" required />

      <label>Password</label>
      <input id="password" type="password" required />

      <button type="submit">Create account</button>
    </form>

    <div id="error" class="error"></div>

    <div class="legal">
      <a href="/legal/terms.html">Terms</a> ·
      <a href="/legal/privacy.html">Privacy</a> ·
      <a href="/legal/refund.html">Refund</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://api.ledgerhaul.com";

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const company = document.getElementById("company").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      try {
        const res = await fetch(`${API_BASE}/auth/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ company, email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Signup failed");
        }

        window.location.href = "/app/check-email.html";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
