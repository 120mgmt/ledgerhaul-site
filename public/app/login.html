<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | LedgerHaul</title>

  <meta name="robots" content="noindex,nofollow" />
  <meta name="ledgerhaul-api-base" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/assets/js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 18px; }
    label { display:block; font-size:14px; margin-top:14px; }
    input {
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #e5e7eb;
      font-size:14px;
    }
    button {
      width:100%;
      margin-top:22px;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#0f766e;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .error {
      margin-top:14px;
      color:#b91c1c;
      font-size:14px;
    }
    .links {
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      font-size:13px;
    }
    .links a { color:#0f766e; text-decoration:underline; }
    .muted {
      margin-top:18px;
      font-size:13px;
      color:#64748b;
      text-align:center;
      line-height: 1.5;
    }
    .muted a { color:#0f766e; text-decoration:underline; }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Sign in</h1>

    <form id="login-form" novalidate>
      <label for="email">
        Email
        <input type="email" id="email" autocomplete="email" required />
      </label>

      <label for="password">
        Password
        <input type="password" id="password" autocomplete="current-password" required />
      </label>

      <button id="submitBtn" type="submit">Sign In</button>
      <div id="error" class="error" hidden></div>
    </form>

    <div class="links">
      <a href="/app/signup.html">Create an account</a>
      <a href="/app/forgot-password.html">Forgot password</a>
    </div>

    <div class="muted">
      By signing in you agree to our
      <a href="/legal/terms.html">Terms</a>,
      <a href="/legal/privacy.html">Privacy</a>,
      and <a href="/legal/refund.html">Refund Policy</a>.
    </div>
  </main>

  <script>
    const metaApi = document.querySelector('meta[name="ledgerhaul-api-base"]');
    const metaApiBase = (metaApi && metaApi.getAttribute("content"))
      ? String(metaApi.getAttribute("content")).trim()
      : "";

    const API_BASE =
      (window.LH_CONFIG && window.LH_CONFIG.API_BASE_URL && String(window.LH_CONFIG.API_BASE_URL).trim())
        ? String(window.LH_CONFIG.API_BASE_URL).trim().replace(/\/+$/, "")
        : (metaApiBase ? metaApiBase.replace(/\/+$/, "") : "https://api.ledgerhaul.com");

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    function safeJsonParse(text) {
      try { return JSON.parse(text); } catch { return null; }
    }

    function showError(msg) {
      errorBox.textContent = msg || "Unable to sign in";
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = "";
    }

    function setStoredValue(key, value) {
      localStorage.setItem(key, value);
      sessionStorage.setItem(key, value);
    }

    function removeStoredValue(key) {
      localStorage.removeItem(key);
      sessionStorage.removeItem(key);
    }

    function clearAuthStorage() {
      removeStoredValue("lh_access_token");
      removeStoredValue("lh_refresh_token");
      removeStoredValue("lh_company");
      removeStoredValue("lh_user");
      removeStoredValue("lh_auth_response");
    }

    function pickToken(data) {
      const candidates = [
        data && data.access_token,
        data && data.accessToken,
        data && data.token,
        data && data.jwt,
        data && data.id_token,
        data && data.idToken
      ];

      for (const candidate of candidates) {
        if (typeof candidate === "string" && candidate.trim()) {
          return candidate.trim();
        }
      }

      return "";
    }

    function pickRefreshToken(data) {
      const candidates = [
        data && data.refresh_token,
        data && data.refreshToken
      ];

      for (const candidate of candidates) {
        if (typeof candidate === "string" && candidate.trim()) {
          return candidate.trim();
        }
      }

      return "";
    }

    function pickUser(data) {
      if (data && data.user && typeof data.user === "object") {
        return data.user;
      }
      if (data && data.account && typeof data.account === "object") {
        return data.account;
      }
      return null;
    }

    function pickCompany(data, user) {
      if (data && data.company && typeof data.company === "object") {
        return data.company;
      }
      if (data && data.tenant && typeof data.tenant === "object") {
        return data.tenant;
      }
      if (user && user.company && typeof user.company === "object") {
        return user.company;
      }
      return null;
    }

    async function resolvePostLoginDestination() {
      return "/app/index.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!email) {
        showError("Email is required.");
        return;
      }

      if (!password) {
        showError("Password is required.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        clearAuthStorage();

        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ email, password }),
          cache: "no-store",
          credentials: "omit"
        });

        const raw = await res.text();
        const data = safeJsonParse(raw) || {};

        if (!res.ok) {
          const err = (data && (data.error || data.message || data.detail)) || "Login failed";
          showError(err);
          return;
        }

        const accessToken = pickToken(data);
        if (!accessToken) {
          showError("Login succeeded but no token was returned.");
          return;
        }

        const refreshToken = pickRefreshToken(data);
        const user = pickUser(data);
        const company = pickCompany(data, user);

        setStoredValue("lh_access_token", accessToken);
        if (refreshToken) {
          setStoredValue("lh_refresh_token", refreshToken);
        }

        if (company) {
          setStoredValue("lh_company", JSON.stringify(company));
        }

        if (user) {
          setStoredValue("lh_user", JSON.stringify(user));
        }

        setStoredValue("lh_auth_response", JSON.stringify(data));

        const nextUrl = await resolvePostLoginDestination();
        window.location.assign(nextUrl);
      } catch (err) {
        showError((err && err.message) ? err.message : "Unable to sign in");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
