<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | LedgerHaul</title>

  <meta name="robots" content="noindex,nofollow" />
  <!-- Optional override without code edits -->
  <meta name="ledgerhaul-api-base" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/assets/js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 18px; }
    label { display:block; font-size:14px; margin-top:14px; }
    input {
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #e5e7eb;
      font-size:14px;
    }
    button {
      width:100%;
      margin-top:22px;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#0f766e;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .error {
      margin-top:14px;
      color:#b91c1c;
      font-size:14px;
    }
    .links {
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      font-size:13px;
    }
    .links a { color:#0f766e; text-decoration:underline; }
    .muted {
      margin-top:18px;
      font-size:13px;
      color:#64748b;
      text-align:center;
      line-height: 1.5;
    }
    .muted a { color:#0f766e; text-decoration:underline; }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Sign in</h1>

    <form id="login-form" novalidate>
      <label for="email">
        Email
        <input type="email" id="email" autocomplete="email" required />
      </label>

      <label for="password">
        Password
        <input type="password" id="password" autocomplete="current-password" required />
      </label>

      <button id="submitBtn" type="submit">Sign In</button>
      <div id="error" class="error" hidden></div>
    </form>

    <div class="links">
      <a href="/app/signup.html">Create an account</a>
      <a href="/app/forgot-password.html">Forgot password</a>
    </div>

    <div class="muted">
      By signing in you agree to our
      <a href="/legal/terms.html">Terms</a>,
      <a href="/legal/privacy.html">Privacy</a>,
      and <a href="/legal/refund.html">Refund Policy</a>.
    </div>
  </main>

  <script>
    const metaApi = document.querySelector('meta[name="ledgerhaul-api-base"]');
    const metaApiBase = (metaApi && metaApi.getAttribute("content")) ? String(metaApi.getAttribute("content")).trim() : "";
    const API_BASE =
      (window.LH_CONFIG && window.LH_CONFIG.API_BASE_URL && String(window.LH_CONFIG.API_BASE_URL).trim())
        ? String(window.LH_CONFIG.API_BASE_URL).trim().replace(/\/+$/,"")
        : (metaApiBase ? metaApiBase.replace(/\/+$/,"") : "https://api.ledgerhaul.com");

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    function safeJsonParse(text) {
      try { return JSON.parse(text); } catch { return null; }
    }

    function showError(msg) {
      errorBox.textContent = msg || "Unable to sign in";
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!email) return showError("Email is required.");
      if (!password) return showError("Password is required.");

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const raw = await res.text();
        const data = safeJsonParse(raw) || {};

        if (!res.ok) {
          const err = (data && (data.error || data.message || data.detail)) || "Login failed";
          return showError(err);
        }

        if (!data.access_token) {
          return showError("Login succeeded but no token was returned.");
        }

        localStorage.setItem("lh_access_token", data.access_token);

        if (data.company) localStorage.setItem("lh_company", JSON.stringify(data.company));
        if (data.user) localStorage.setItem("lh_user", JSON.stringify(data.user));

        window.location.href = "/app/dashboard.html";
      } catch (err) {
        showError((err && err.message) ? err.message : "Unable to sign in");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
