<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | LedgerHaul</title>

  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/assets/js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 18px; }
    label { display:block; font-size:14px; margin-top:14px; }
    input {
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #e5e7eb;
      font-size:14px;
    }
    button {
      width:100%;
      margin-top:22px;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#0f766e;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    .error {
      margin-top:14px;
      color:#b91c1c;
      font-size:14px;
    }
    .muted {
      margin-top:18px;
      font-size:13px;
      color:#64748b;
      text-align:center;
    }
    .muted a { color:#0f766e; text-decoration:underline; }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Sign in</h1>

    <form id="login-form">
      <label>
        Company ID
        <input type="number" id="company_id" required min="1" />
      </label>

      <label>
        Email
        <input type="email" id="email" required />
      </label>

      <label>
        Password
        <input type="password" id="password" required />
      </label>

      <button type="submit">Sign In</button>
      <div id="error" class="error" hidden></div>
    </form>

    <div class="muted">
      By signing in you agree to our
      <a href="/legal/terms.html">Terms</a>,
      <a href="/legal/privacy.html">Privacy</a>,
      and <a href="/legal/refund.html">Refund Policy</a>.
    </div>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;

      const payload = {
        company_id: Number(document.getElementById("company_id").value),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch(`${window.LH_CONFIG.API_BASE_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Login failed");
        }

        // Store token (phase 1: localStorage; can move to HttpOnly cookie later)
        localStorage.setItem("lh_access_token", data.access_token);

        window.location.href = "/app/dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Unable to sign in";
        errorBox.hidden = false;
      }
    });
  </script>
</body>
</html>
