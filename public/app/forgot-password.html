<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset password | LedgerHaul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Request a password reset for your LedgerHaul account." />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
    }
    a { color: #37d18c; text-decoration: none; }

    .wrap {
      max-width: 420px;
      margin: 120px auto;
      padding: 36px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
      text-align: center;
    }

    h1 { margin-bottom: 12px; font-size: 26px; }
    p { margin-bottom: 22px; color: #cfe6db; font-size: 14px; }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #214536;
      background: #0e1f17;
      color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      background: #37d18c;
      color: #0b140f;
      cursor: pointer;
    }
    button:disabled { opacity: .7; }

    .msg { margin-top: 14px; font-size: 13px; }
    .error { color: #ffb4b4; }
    .ok { color: #b8ffd8; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Reset your password</h1>
    <p>Enter your email and we’ll send you a reset link.</p>

    <form id="form">
      <input id="email" type="email" placeholder="Email address" required />
      <button id="btn">Send reset link</button>
      <div id="msg" class="msg"></div>
    </form>

    <p style="margin-top:18px">
      <a href="/app/login.html">Back to sign in</a>
    </p>
  </div>

  <script>
    const API_BASE = "https://YOUR-BACKEND-RENDER-URL";
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });

        if (!res.ok) throw new Error("Unable to send reset email");
        msg.textContent = "Check your email for a reset link.";
        msg.className = "msg ok";
      } catch (e) {
        msg.textContent = e.message;
        msg.className = "msg error";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
