<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Set new password | LedgerHaul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Set a new password for your LedgerHaul account." />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="ledgerhaul-api-base" content="" />

  <script src="/assets/js/config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
    }
    a { color: #37d18c; text-decoration: none; }

    .wrap {
      max-width: 460px;
      margin: 120px auto;
      padding: 36px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
    }

    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0 0 22px; color: #cfe6db; font-size: 14px; }

    label { display:block; font-size: 13px; color:#cfe6db; margin-bottom:6px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #214536;
      background: #0e1f17;
      color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      background: #37d18c;
      color: #0b140f;
      cursor: pointer;
    }
    button:disabled { opacity: .7; }

    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .error { color: #ffb4b4; }
    .ok { color: #b8ffd8; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Set a new password</h1>
    <p>Use the link from your email. If the link is invalid, request a new reset email.</p>

    <form id="form" novalidate>
      <label>New password</label>
      <input id="password" type="password" autocomplete="new-password" required />

      <label>Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" required />

      <button id="btn" type="submit">Update password</button>
      <div id="msg" class="msg"></div>
    </form>

    <p style="margin-top:18px">
      <a href="/app/forgot-password.html">Request a new reset link</a>
    </p>
  </div>

  <script>
    const metaApi = document.querySelector('meta[name="ledgerhaul-api-base"]');
    const metaApiBase = (metaApi && metaApi.getAttribute("content"))
      ? String(metaApi.getAttribute("content")).trim()
      : "";

    const API_BASE =
      (window.LH_CONFIG && window.LH_CONFIG.API_BASE_URL && String(window.LH_CONFIG.API_BASE_URL).trim())
        ? String(window.LH_CONFIG.API_BASE_URL).trim().replace(/\/+$/,"")
        : (metaApiBase ? metaApiBase.replace(/\/+$/,"") : "https://api.ledgerhaul.com");

    const params = new URLSearchParams(window.location.search);
    const token = (params.get("token") || "").trim();

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    function safeJsonParse(text) {
      try { return JSON.parse(text); } catch { return null; }
    }

    function setMsg(text, ok) {
      msg.textContent = text || "";
      msg.className = "msg " + (ok ? "ok" : "error");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("", false);
      btn.disabled = true;

      try {
        if (!token) {
          throw new Error("Missing reset token. Use the link from your email.");
        }

        const p1 = document.getElementById("password").value;
        const p2 = document.getElementById("confirm").value;

        if (!p1 || p1.length < 10) throw new Error("Password must be at least 10 characters.");
        if (p1 !== p2) throw new Error("Passwords do not match.");

        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: p1 })
        });

        const raw = await res.text();
        const data = safeJsonParse(raw) || {};

        if (!res.ok) {
          const err = data.error || data.message || data.detail || "Password reset failed";
          throw new Error(err);
        }

        setMsg("Password updated. Redirecting to sign in...", true);
        setTimeout(() => { window.location.href = "/app/login.html"; }, 1000);
      } catch (e) {
        setMsg(e.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
