<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Set new password | LedgerHaul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Set a new password for your LedgerHaul account." />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0e1f17;
      color: #f4fff9;
    }
    a { color: #37d18c; text-decoration: none; }

    .wrap {
      max-width: 460px;
      margin: 120px auto;
      padding: 36px;
      background: #13261e;
      border: 1px solid #214536;
      border-radius: 16px;
    }

    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0 0 22px; color: #cfe6db; font-size: 14px; }

    label { display:block; font-size: 13px; color:#cfe6db; margin-bottom:6px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #214536;
      background: #0e1f17;
      color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      background: #37d18c;
      color: #0b140f;
      cursor: pointer;
    }
    button:disabled { opacity: .7; }

    .msg { margin-top: 14px; font-size: 13px; }
    .error { color: #ffb4b4; }
    .ok { color: #b8ffd8; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Set a new password</h1>
    <p>Use the link from your email. If the link is invalid, request a new reset email.</p>

    <form id="form">
      <label>New password</label>
      <input id="password" type="password" required />

      <label>Confirm password</label>
      <input id="confirm" type="password" required />

      <button id="btn">Update password</button>
      <div id="msg" class="msg"></div>
    </form>

    <p style="margin-top:18px">
      <a href="/app/forgot-password.html">Request a new reset link</a>
    </p>
  </div>

  <script>
    const API_BASE = "https://YOUR-BACKEND-RENDER-URL";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    function setMsg(text, ok) {
      msg.textContent = text;
      msg.className = ok ? "msg ok" : "msg error";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.disabled = true;

      try {
        if (!token) {
          throw new Error("Missing reset token. Use the link from your email.");
        }

        const p1 = document.getElementById("password").value;
        const p2 = document.getElementById("confirm").value;

        if (p1.length < 8) throw new Error("Password must be at least 8 characters.");
        if (p1 !== p2) throw new Error("Passwords do not match.");

        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: p1 })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Password reset failed");

        setMsg("Password updated. Redirecting to sign in...", true);
        setTimeout(() => { window.location.href = "/app/login.html"; }, 900);
      } catch (e) {
        setMsg(e.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
